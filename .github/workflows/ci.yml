name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Stack
        uses: ./.github/actions/setup-stack

      - name: Build
        run: stack build

      - name: Test
        run: stack test
