name: Diagnose Linux GPU
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GPU_BACKEND: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stack
      - run: stack build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run gpu:browser
      - run: xvfb-run -a npm --prefix frontend run gpu:test -- --self-test
      - run: xvfb-run -a npm --prefix frontend run gpu:spike -- --goldens --repeats 0
      - name: Kernel and memory diagnostics
        if: always()
        run: |
          free -h
          sudo dmesg | tail -40
