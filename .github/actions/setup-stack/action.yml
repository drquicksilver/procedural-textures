name: Set up Stack
description: Install Stack (Stack itself installs the snapshot's GHC) and restore the Stack cache.

runs:
  using: composite
  steps:
    - name: Install Stack
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-no-global: true
        stack-version: latest

    - name: Cache Stack
      uses: actions/cache@v4
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'procedural-textures.cabal') }}
        restore-keys: |
          ${{ runner.os }}-stack-
