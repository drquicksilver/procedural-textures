name: Diagnose Linux GPU
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GPU_BACKEND: swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run gpu:browser
      - name: Enable native driver diagnostics
        run: |
          python3 - <<'PY'
          p = 'frontend/scripts/gpu-session.mjs'
          s = open(p).read().replace('protocolTimeout: 600000, args', 'protocolTimeout: 600000, dumpio: true, args')
          s = s.replace("'--disable-gpu-watchdog'", "'--disable-gpu-watchdog', '--enable-logging=stderr'")
          open(p, 'w').write(s)
          PY
      - run: /usr/bin/time -v npm --prefix frontend run gpu:test -- --case cumulus
      - name: Kernel and memory diagnostics
        if: always()
        run: |
          free -h
          sudo dmesg | tail -40
