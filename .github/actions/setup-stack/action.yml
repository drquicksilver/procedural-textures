name: Set up Stack
description: Install Stack and cache dependencies separately from source-dependent project builds.

runs:
  using: composite
  steps:
    - name: Install Stack
      uses: haskell-actions/setup@v2
      with:
        enable-stack: true
        stack-no-global: true
        stack-version: latest

    - name: Cache Stack dependencies
      uses: actions/cache@v4
      with:
        path: ~/.stack
        key: ${{ runner.os }}-stack-deps-v2-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'procedural-textures.cabal') }}
        restore-keys: |
          ${{ runner.os }}-stack-deps-v2-
          ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'procedural-textures.cabal') }}

    - name: Cache project build
      uses: actions/cache@v4
      with:
        path: .stack-work
        key: ${{ runner.os }}-stack-project-v2-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'procedural-textures.cabal') }}-${{ hashFiles('src/**', 'app/**', 'test/**', 'fonts/**') }}
        restore-keys: |
          ${{ runner.os }}-stack-project-v2-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'procedural-textures.cabal') }}-
