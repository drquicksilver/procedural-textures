name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Stack
        uses: ./.github/actions/setup-stack

      - name: Build
        run: stack build

      - name: Test
        run: stack test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      GPU_BACKEND: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run gpu:browser
      # Production static assets under a repository prefix; no Haskell process.
      - name: Browser tests
        run: xvfb-run -a make e2e

  gpu-conformance:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      GPU_BACKEND: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Stack
        uses: ./.github/actions/setup-stack
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      # The lockfile pins Puppeteer's supported Chrome revision. This job
      # explicitly selects and verifies Mesa llvmpipe, independent of runner GPU.
      - run: npm --prefix frontend run gpu:browser
      - run: stack build
      - run: xvfb-run -a npm --prefix frontend run gpu:test -- --self-test
      - run: xvfb-run -a npm --prefix frontend run gpu:spike -- --goldens --repeats 0
      - name: Upload GPU comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-conformance
          path: |
            out/gpu-conformance/
            out/gpu-spike/
